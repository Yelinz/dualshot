apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk = 36
    compileOptions.encoding = 'UTF-8'

    defaultConfig {
        applicationId "ch.zzd.dualshot"
        minSdkVersion 23
        targetSdkVersion 36
        //compileSdkVersion 31 // needed to support appcompat:1.4.0 (which we need for emoji policy support, and not yet ready to target SDK 30)

        testApplicationId "net.sourceforge.opencamera.test"
        //testInstrumentationRunner "android.test.InstrumentationTestRunner"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }


    // needed to use android.test package (ActivityInstrumentationTestCase2 etc) when targetting sdk 28 (Android 9) -
    // see https://developer.android.com/training/testing/set-up-project
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    // NOTE: `namespace` must stay at the upstream Java/Kotlin package. It is what
    // decides where AGP generates the R class, so changing it to ch.zzd.dualshot
    // moved R to ch.zzd.dualshot.R and every unqualified `R.` in the ~33 Java files
    // and in dualcam/PipController.kt stopped resolving (CI run 32663871784,
    // 2026-08-23: "Unresolved reference 'R'", :app:compileDebugKotlin FAILED).
    // The rebrand lives in `applicationId` above (install identity + signing) and in
    // the app_name string — those are the only two the stores and the launcher see.
    namespace 'net.sourceforge.opencamera'
    buildFeatures {
    }
    //useLibrary 'android.test.mock'

    // Kotlin compiles alongside Java for the dualcam/ engine port; jvmTarget matches the
    // java.toolchain below (Java 17).
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    //implementation 'androidx.activity:activity:1.9.3' // needed for EdgeToEdge.enable(this)

    // appcompat version must be 1.4.0 or later to satisfy emoji policy!
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // needed to fix errors since upgrading to appcompat:1.7.0, see https://stackoverflow.com/questions/75263047/duplicate-class-in-kotlin-android
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.0"))

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation 'androidx.exifinterface:exifinterface:1.4.2'

    // dualcam/ engine port (net.sourceforge.opencamera.dualcam): coroutines for
    // PhotoProcessor's Dispatchers.Default work.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'

    // newer AndroidJUnit4 InstrumentedTest
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
