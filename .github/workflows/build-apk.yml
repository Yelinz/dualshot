# Builds a debug APK on every push/PR and publishes it as a workflow artifact.
# No releases are cut from here (yet) - grab the APK from the run's Artifacts section.
#
# The badge in README.md points at this workflow ON PURPOSE. This repo spent its
# first two weeks public with a red X nobody saw: the only run ever made failed,
# because the rebrand moved `namespace` and with it the generated R class. A
# badge on the front page is the cheapest way for the next such break to be
# noticed by whoever opens the repo, which is the whole audience this project has.
name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencamera-dualcam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
